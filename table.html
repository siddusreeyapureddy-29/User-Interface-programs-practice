<html>
    <head>
        <title>creating a table for time table</title>
    </head>
    <body>
        <h1>Time table</h1>
        <table border="2">
            <tr>
                <th> </th>
                <th>I</th>
                <th>II</th>
                <th>III</th>
                <th rowspan="7">LUNCH BREAK </th>
                <th>IV</th>
                <th>V</th>
                <th>VI</th>
            </tr>
            <tr>
                <th>Monday</th>
                <td>java</td>
                <td>python</td>
                <td>mysql</td>
                <td>angular</td>
                <td>react</td>
                <td>java</td>
                
            </tr>
             <tr>
                <th>Tuesday</th>
                <td colspan="3" align="center">java lab</td>
                <td>python</td>
                <td>mysql</td>
                <td>angular</td>
                
            </tr>
             <tr>
                <th>Wednesday</th>
                <td>python</td>
                <td>angular</td>
                <td>java</td>
                <td colspan="3" align="center">angular lab</td>
                
            </tr>
             <tr>
                <th>Thursday</th>
                <td colspan="2" align="center">java</td>
                <td>angular</td>
                <td>mysql</td>
                <td>python</td>
                <td>react</td>
               
            </tr>
             <tr>
                <th>Friday</th>
                <td>angular</td>
                <td>java</td>
                <td>python</td>
                <td>angular</td>
                <td colspan="2" align="center">react lab</td>               
            </tr>
             <tr>
                <th>Saturday</th>
                <td>java</td>
                <td>python</td>
                <td>mysql</td>
                <td>angular</td>
                <td colspan="2" align="center">sports</td>                
            </tr>

        </table>
    </body>
</html>
