<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <h1>Student Registration</h1>
        <form name="Registration" method="post">
            <input type="text box" name="Name" id="Name" palceholder="fIRST NAME"><br>
            <input type="email" name="Email" id="Email" placeholder="EMAIL"><br>
            <input type="number" name="mobile number" id="mobile number" placeholder="MOBILE NUMBER"><br>
            <label>Gender</label>
            <label>M</label>
            <input type="radio" name="gender" id="Male" value="Male">
            <label>F</label>
            <input type="radio" name="gender" id="Female" value="Female">
            <label>Others</label>
            <input type="radio" name="gender" id="others" value="others">
            <br>
            <label>Skills:</label>
            <input type="checkbox" name="Java" value="Java"> Java
            <input type="checkbox" name="python" value="python"> python
            <input type="checkbox" name="mysql" value="mysql"> mysql
            <input type="checkbox" name="html" value="html"> html
            <br><br>
            <input type="date" name="Date of Birth" value="Date of Birth">
            <br><br>
            <input type="submit" name="submit" value="submit">
            <br><br>
            <input type="reset" name="reset" value="reset">

        </form>
    </body>
</html>
