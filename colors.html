<html>
    <head>
        <title>Background color and text color</title>
        <style>
            .div1{
                background-color: RGB(250, 85, 119);
                width:170px;
                height:150px;
                border-radius:12px;
            }
            h4{
                text-align:center;
                margin-top:20px;
            }
           
        </style>
    </head>
    <body>
        <h1>CSS Color Formats Demo</h1>
        <p>Different Background and text colors using RGB,RGBA,HEX,HSL,HSLA and more</p>
        <div class="div1">
            <h4 class="h4">1.RGB</h4>
            <p>The div uses background-color in RGB format</p>
            <p>This paragraph has a different text color</p>
        </div>
    </body>
</html>
