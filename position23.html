<html>
    <head>
        <title>image with css position</title>
        <style>
            .div1{
                background-image:url('./natureimage.jpg');
                background-size:cover;
                background-repeat:no-repeat;
                background-position:center;
                width:800px;
                height:500px;
                border:2px solid black;
                position:relative;
            }
            .h{
                color:black;
                position:absolute;
                top:100px;
                left:230px;
            }
            .h1{
                color:black;
                position:absolute;
                top:150px;
                left:250px;
            }
            .h2{
                 color:black;
                position:absolute;
                top:175px;
                left:320px;
            }
            .but{
                position:absolute;
                top:220px;
                left:290px;
                background-color:orange;
            }
            .but2{
                 position:absolute;
                top:220px;
                left:400px;
            }
            
            
        </style>
    </head>
    <body>
        <div class="div1">
            <h1 class="h">Explore The World</h1>
            <p class="h1">Discover amaging places and unforgettable</p>
            <p class="h2"> experiences</p>
            <div>
                <button class="but">Get Started</button>
                <button class="but2">Learn More</button>
            </div>
        </div>

    </body>
</html>
